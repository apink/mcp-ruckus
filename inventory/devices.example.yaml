# inventory/devices.example.yaml
# Copy to devices.yaml and fill in your real devices.
# Do not commit devices.yaml to git.
#
# username / password support env var substitution:
#   ${VAR_NAME} → read from .env
#   string literal → used directly

devices:
  # ICX Core — credential via env var
  - host: 192.0.2.50
    name: icx-core
    vendor: ruckus
    role: core-switch
    location: DC-01
    rack: A-01
    username: ${ICX_CORE_USER}
    password: ${ICX_CORE_PASS}

  # ICX Distribution — literal credential
  - host: 198.51.100.51
    name: icx-dist-01
    vendor: ruckus
    role: distribution-switch
    location: DC-01
    rack: A-02
    username: admin-dist
    password: CHANGE_ME

  # ICX Edge
  - host: 203.0.113.52
    name: icx-edge-floor1
    vendor: ruckus
    role: access-switch
    location: Office-F1
    rack: B-05
    username: admin-edge
    password: CHANGE_ME

  # ICX Remote Branch
  - host: 198.51.100.1
    name: icx-branch-01
    vendor: ruckus
    role: access-switch
    location: Branch-A
    username: ${BRANCH_USER}
    password: ${BRANCH_PASS}
