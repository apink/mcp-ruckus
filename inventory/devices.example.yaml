# inventory/devices.example.yaml
# Copy to devices.yaml and fill in your real devices.
# Do not commit devices.yaml to git.
#
# username / password support env var substitution:
#   ${VAR_NAME} → read from .env
#   string literal → used directly

devices:
  # ICX Core — credential via env var
  - host: 10.0.0.50
    name: icx-core
    vendor: ruckus
    role: core-switch
    location: DC-JKT
    rack: A-01
    username: ${ICX_CORE_USER}
    password: ${ICX_CORE_PASS}

  # ICX Distribution — literal credential
  - host: 10.0.0.51
    name: icx-dist-01
    vendor: ruckus
    role: distribution-switch
    location: DC-JKT
    rack: A-02
    username: admin-dist
    password: dist-pass

  # ICX Edge
  - host: 10.0.0.52
    name: icx-edge-floor1
    vendor: ruckus
    role: access-switch
    location: Office-JKT-F1
    rack: B-05
    username: admin-edge
    password: edge-pass

  # ICX Remote Branch
  - host: 10.0.10.1
    name: icx-branch-medan
    vendor: ruckus
    role: access-switch
    location: Branch-Medan
    username: ${BRANCH_USER}
    password: ${BRANCH_PASS}
