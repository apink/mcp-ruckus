[project]
name = "mcp-ruckus"
version = "0.1.0"
description = "MCP server for Ruckus infrastructure — vSZ SmartZone wireless controllers + ICX switches"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ruckus", "smartzone", "vsz", "icx", "switch", "wireless", "wifi", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=0.5.0",
    "httpx>=0.28.0",
    "netmiko>=4.4.0",
    "paramiko>=3.4.0",
    "pyyaml>=6.0.1",
    "urllib3>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/apink/mcp-ruckus"
Repository = "https://github.com/apink/mcp-ruckus"

[project.scripts]
mcp-ruckus = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "inventory", "models", "tools"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "models", "tools", "inventory"]
